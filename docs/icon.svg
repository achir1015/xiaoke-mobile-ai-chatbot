<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 小柯頭盔機器人（比例同 App 內 drawRobot，s=1.43、中心 256,254） -->
  <defs>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0bed2"/><stop offset="1" stop-color="#687892"/></linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcfdff"/><stop offset="1" stop-color="#c4cbd6"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3450"/><stop offset="1" stop-color="#091220"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#101522"/>
  <g id="robot">
    <!-- 耳罩 -->
    <rect x="55.8" y="191.1" width="54.3" height="131.6" rx="22.9" fill="url(#ear)"/>
    <rect x="401.9" y="191.1" width="54.3" height="131.6" rx="22.9" fill="url(#ear)"/>
    <rect x="67.3" y="211.1" width="12.9" height="80.1" rx="7.2" fill="#ced8e8"/>
    <rect x="430.4" y="211.1" width="12.9" height="80.1" rx="7.2" fill="#ced8e8"/>
    <!-- 頭盔 -->
    <rect x="77.3" y="116.7" width="357.5" height="283.1" rx="128.7" fill="#808a9a"/>
    <rect x="78.7" y="112.4" width="354.6" height="277.4" rx="125.8" fill="url(#helmet)"/>
    <ellipse cx="167.3" cy="139.6" rx="48.6" ry="12.9" fill="#fff"/>
    <!-- 面罩 -->
    <rect x="110.1" y="152.5" width="291.7" height="203.1" rx="80.1" fill="#344660"/>
    <rect x="115.9" y="158.2" width="280.3" height="191.6" rx="74.4" fill="url(#visor)"/>
    <ellipse cx="184.5" cy="179.6" rx="45.8" ry="10" fill="#2c4666"/>
    <!-- 發光的笑眼與微笑 -->
    <g fill="none" stroke="#40e8ff" stroke-linecap="round" filter="url(#glow)">
      <path d="M174.1 245.2 A19 19 0 0 1 212.1 245.2" stroke-width="13"/>
      <path d="M299.9 245.2 A19 19 0 0 1 337.9 245.2" stroke-width="13"/>
      <path d="M279 290 A27 27 0 0 1 233 290" stroke-width="12"/>
    </g>
  </g>
</svg>
